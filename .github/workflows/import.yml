name: Import Nightwell Dev source
on:
  push:
    paths:
      - "bootstrap/go.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand and publish source
        shell: bash
        run: |
          if [ ! -f bootstrap/go.txt ]; then
            echo "Import already completed"
            exit 0
          fi
          test "$(find bootstrap -name 'part-*' -type f | wc -l)" -eq 6
          cat bootstrap/part-* > /tmp/nightwell-dev.base64
          base64 --decode /tmp/nightwell-dev.base64 > /tmp/nightwell-dev.tar.xz
          echo "2f010a3739b47f8887f51df698254c6bf134c57a8b27df31817e28d8094291dd  /tmp/nightwell-dev.tar.xz" | sha256sum --check
          tar -xJf /tmp/nightwell-dev.tar.xz -C .
          git rm -r -f bootstrap
          git add -A
          git config user.name "nightwell-dev-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Import Nightwell Dev Django portal"
          git push origin HEAD:main
