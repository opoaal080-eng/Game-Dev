name: Import Nightwell Dev source
on:
  push:
    paths:
      - "bootstrap/nightwell-dev.tar.xz.b64"
      - ".github/workflows/import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand and publish source
        shell: bash
        run: |
          if [ ! -f bootstrap/nightwell-dev.tar.xz.b64 ]; then
            echo "No source payload yet"
            exit 0
          fi
          base64 --decode bootstrap/nightwell-dev.tar.xz.b64 > /tmp/nightwell-dev.tar.xz
          echo "2f010a3739b47f8887f51df698254c6bf134c57a8b27df31817e28d8094291dd  /tmp/nightwell-dev.tar.xz" | sha256sum --check
          tar -xJf /tmp/nightwell-dev.tar.xz -C .
          git rm -f bootstrap/nightwell-dev.tar.xz.b64
          git add -A
          git config user.name "nightwell-dev-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "Import Nightwell Dev Django portal"
          git push origin HEAD:main
