name: Nightwell Dev checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run Django tests
        run: |
          export DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')
          export DJANGO_DEBUG=true
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

  smoke:
    name: Verify live login page
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway HTTPS login page
        run: |
          set -e
          for i in $(seq 1 18); do
            code=$(curl -sSL --max-time 12 -o /tmp/login-page.html -w "%{http_code}" "https://nightwell-dev-web-production.up.railway.app/login/" || echo "000")
            echo "Attempt $i HTTP $code"
            if [ "$code" = 200 ]; then
              grep -qi "nightwell" /tmp/login-page.html
              exit 0
            fi
            sleep 5
          done
          echo "Login endpoint did not return HTTP 200" >&2
          exit 1
