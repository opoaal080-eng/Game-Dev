name: Nightwell Dev checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Validate GitHub Pages JavaScript
        run: node --check pages/app.js
      - name: Validate ASHFALL public website
        run: |
          node --check static/player/site.js
          python -m py_compile deploy/ashfall_server.py portal/public_site.py
          python -m json.tool ashfall/data/public.json >/dev/null
      - name: Run Django tests
        run: |
          export DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(64))')
          export DJANGO_DEBUG=true
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

  smoke:
    name: Verify live login page
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway HTTPS login page
        run: |
          set -e
          for i in $(seq 1 18); do
            code=$(curl -sSL --max-time 12 -o /tmp/login-page.html -w "%{http_code}" "https://nightwell-dev-web-production.up.railway.app/login/" || echo "000")
            echo "Attempt $i HTTP $code"
            if [ "$code" = 200 ]; then
              grep -qi "nightwell" /tmp/login-page.html
              exit 0
            fi
            sleep 5
          done
          echo "Login endpoint did not return HTTP 200" >&2
          exit 1

      - name: Verify Game Bible and native API require authentication
        run: |
          set -e
          base="https://nightwell-dev-web-production.up.railway.app"
          api=$(curl -sS --max-time 20 -o /tmp/native-api-response.json -w "%{http_code}" "$base/api/v1/me/")
          echo "Unauthenticated API status: $api"
          test "$api" = "401"
          grep -q 'error' /tmp/native-api-response.json
          website=$(curl -sS --max-time 20 -o /dev/null -w "%{http_code}" "$base/information/")
          echo "Unauthenticated game information status: $website"
          test "$website" = "302"

      - name: Verify public ASHFALL service and published data
        run: |
          set -e
          public="https://ashfall-public-website-production.up.railway.app"
          for i in $(seq 1 8); do
            status=$(curl -sSL --max-time 15 -o /tmp/ashfall-page.html -w "%{http_code}" "$public/" || true)
            echo "ASHFALL public homepage attempt $i: HTTP $status"
            if [ "$status" = 200 ] && grep -q "ASHFALL" /tmp/ashfall-page.html; then
              break
            fi
            sleep 5
          done
          test "$status" = 200
          api_status=$(curl -sSL --max-time 15 -o /tmp/ashfall-public.json -w "%{http_code}" "https://nightwell-dev-web-production.up.railway.app/api/public/ashfall/")
          echo "ASHFALL public JSON: HTTP $api_status"
          test "$api_status" = 200
          python - <<'PY'
          import json
          with open('/tmp/ashfall-public.json', encoding='utf-8') as f:
              doc = json.load(f)
          assert doc['schema'] == 1
          assert doc['title'] == 'ASHFALL'
          assert 'news' in doc
          print('Public ASHFALL JSON verified')
          PY

      - name: Verify GitHub Pages public ASHFALL site
        run: |
          set -e
          site="https://opoaal080-eng.github.io/Game-Dev/ashfall/"
          for i in $(seq 1 10); do
            code=$(curl -sSL --max-time 20 -o /tmp/ashfall-gh.html -w "%{http_code}" "$site" || true)
            echo "GitHub Pages attempt $i: HTTP $code"
            if [ "$code" = 200 ] && grep -q 'id="hero-title"' /tmp/ashfall-gh.html; then
              break
            fi
            sleep 5
          done
          test "$code" = 200
          grep -q 'id="hero-title"' /tmp/ashfall-gh.html
          css=$(curl -sSL --max-time 20 -o /dev/null -w "%{http_code}" "https://opoaal080-eng.github.io/Game-Dev/static/player/site.css")
          data=$(curl -sSL --max-time 20 -o /dev/null -w "%{http_code}" "${site}data/public.json")
          echo "CSS: HTTP $css, public data: HTTP $data"
          test "$css" = 200
          test "$data" = 200
