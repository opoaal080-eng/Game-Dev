name: Publish ASHFALL player website data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ashfall.yml'

permissions:
  contents: write

concurrency:
  group: ashfall-public-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Export approved player content to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public published data only
        env:
          ASHFALL_PUBLIC_SOURCE: https://nightwell-dev-web-production.up.railway.app/api/public/ashfall/
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          source = os.environ["ASHFALL_PUBLIC_SOURCE"]
          request = Request(source, headers={"Accept": "application/json", "User-Agent": "ASHFALL-GitHub-Publisher"})
          with urlopen(request, timeout=25) as response:
              if response.status != 200:
                  raise SystemExit(f"Unexpected source status: {response.status}")
              raw = response.read(256 * 1024)
          data = json.loads(raw)
          if data.get("schema") != 1 or type(data.get("published")) is not bool or not isinstance(data.get("title"), str) or not data["title"].strip():
              raise SystemExit("Refusing unexpected or unapproved JSON source")
          path = Path("ashfall/data/public.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          clean = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
          path.write_text(clean, encoding="utf-8")
          print("ASHFALL snapshot exported. Published:", data["published"], "News:", len(data.get("news", [])))
          PY
      - name: Commit snapshot only when it changes
        run: |
          git config user.name "ashfall-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ashfall/data/public.json
          if git diff --cached --quiet; then
            echo "No public content changes."
          else
            git commit -m "Publish ASHFALL public website content [skip ci]"
            git push origin HEAD:main
          fi
