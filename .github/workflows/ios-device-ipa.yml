name: Nightwell Dev iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/ios/**"
      - ".github/workflows/ios-device-ipa.yml"

permissions:
  contents: write

jobs:
  iphone-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd clients/ios
          xcodegen generate
      - name: Compile for physical iPhone
        run: |
          xcodebuild -project clients/ios/NightwellDev.xcodeproj \
            -scheme NightwellDev \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iphone-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Check full-screen iPhone launch configuration
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/iphone-build/Build/Products/Release-iphoneos/NightwellDev.app/Info.plist"
          test -f "$PLIST"
          echo "Launch screen configuration:"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchScreen' "$PLIST" | grep -q 'Dict'
          echo "Launch screen present — no legacy iPhone letterboxing."
      - name: Create IPA with Payload directory
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/iphone-build/Build/Products/Release-iphoneos/NightwellDev.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/iphone-package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/iphone-package/Payload/"
          cd "$RUNNER_TEMP/iphone-package"
          zip -q -r "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.2.ipa" Payload
          unzip -l "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.2.ipa" | grep -q 'Payload/NightwellDev.app/'
      - name: Upload IPA as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightwellDev-iPhone-unsigned-v0.2-IPA
          path: ${{ runner.temp }}/NightwellDev-iPhone-unsigned-v0.2.ipa
          if-no-files-found: error
      - name: Publish downloadable IPA as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "nightwell-dev-ios-unsigned-v0.2" \
            "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.2.ipa#NightwellDev-iPhone-unsigned-v0.2.ipa" \
            --title "Nightwell Dev for iPhone v0.2 (full-screen fix)" \
            --notes "Fixed edge-to-edge iPhone launch screen, tab labels and layout. Native SwiftUI app compiled for physical iPhone. Unsigned build: sign with your own sideloading certificate before installation. Not an App Store or Apple Developer signed release." \
            --prerelease \
            --target "${{ github.sha }}" \
            || gh release upload "nightwell-dev-ios-unsigned-v0.2" \
              "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.2.ipa#NightwellDev-iPhone-unsigned-v0.2.ipa" --clobber
