name: Nightwell Dev iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/ios/**"
      - ".github/workflows/ios-device-ipa.yml"

permissions:
  contents: write

jobs:
  iphone-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Nightwell Studio app icon
        run: |
          set -euo pipefail
          OUTPUT="clients/ios/NightwellDev/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          swift clients/ios/IconSource/generate_icon.swift "$OUTPUT"
          sips -g pixelHeight -g pixelWidth "$OUTPUT"
          test -s "$OUTPUT"
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd clients/ios
          xcodegen generate
      - name: Compile for physical iPhone
        run: |
          xcodebuild -project clients/ios/NightwellDev.xcodeproj \
            -scheme NightwellDev \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/iphone-build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Check full-screen iPhone launch configuration
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/iphone-build/Build/Products/Release-iphoneos/NightwellDev.app/Info.plist"
          test -f "$PLIST"
          echo "Launch screen configuration:"
          /usr/libexec/PlistBuddy -c 'Print :UILaunchStoryboardName' "$PLIST" | grep -qx 'LaunchScreen'
          APP="$RUNNER_TEMP/iphone-build/Build/Products/Release-iphoneos/NightwellDev.app"
          test -n "$(find "$APP" -type d -name 'LaunchScreen.storyboardc' -print -quit)"
          echo "Explicit full-size LaunchScreen storyboard packaged successfully."
          test -s "$APP/Assets.car"
          echo "Compiled iOS app icon asset catalog present."
      - name: Create IPA with Payload directory
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/iphone-build/Build/Products/Release-iphoneos/NightwellDev.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/iphone-package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/iphone-package/Payload/"
          cd "$RUNNER_TEMP/iphone-package"
          zip -q -r "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.4.ipa" Payload
          unzip -l "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.4.ipa" | grep -q 'Payload/NightwellDev.app/'
      - name: Upload IPA as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightwellDev-iPhone-unsigned-v0.4-IPA
          path: ${{ runner.temp }}/NightwellDev-iPhone-unsigned-v0.4.ipa
          if-no-files-found: error
      - name: Publish downloadable IPA as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "nightwell-dev-ios-unsigned-v0.4" \
            "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.4.ipa#NightwellDev-iPhone-unsigned-v0.4.ipa" \
            --title "Nightwell Dev for iPhone v0.4 (documents, files, icon)" \
            --notes "Fixed documents and files loading, configurable home server, independent refresh, native upload/download, code preview and Nightwell Studio app icon. Native SwiftUI app compiled for physical iPhone. Unsigned build: sign with your own sideloading certificate before installation. Not an App Store or Apple Developer signed release." \
            --prerelease \
            --target "${{ github.sha }}" \
            || gh release upload "nightwell-dev-ios-unsigned-v0.4" \
              "$RUNNER_TEMP/NightwellDev-iPhone-unsigned-v0.4.ipa#NightwellDev-iPhone-unsigned-v0.4.ipa" --clobber
