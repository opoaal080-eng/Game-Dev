name: NightwellDev
options:
  bundleIdPrefix: fun.nightwell
targets:
  NightwellDev:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [NightwellDev]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.nightwell.dev
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nightwell Dev
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
